<html lang="en">
<head>
<meta charset="utf-8">

<title>NYC Health + Hospitals — Insight 1</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1f3a8a; --muted:#6b7280; --line:#e5e7eb;
    --accent:#f7902f; --btn:#ffffff; --btn-ink:#1f2937;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--btn-ink)}
  .book{max-width:1400px;margin:0 auto;padding:12px 16px 16px}
  .stage{position:relative;width:100%;aspect-ratio:1600/1036;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.08);touch-action:pan-y;user-select:none}
  .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease;pointer-events:none}
  .slide.active{opacity:1}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--btn-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:transform .15s,opacity .2s,background .15s;z-index:2}
  .nav:hover{background:#fff;transform:translateY(-50%) scale(1.06)}
  .nav:disabled{opacity:0;pointer-events:none}
  .nav svg{width:20px;height:20px}
  .prev{left:12px}.next{right:12px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 8px;font-size:13px;color:var(--muted)}
  .count b{color:var(--ink)}
  .progress{flex:1;height:3px;background:var(--line);border-radius:3px;margin-left:14px;overflow:hidden}
  .progress span{display:block;height:100%;background:var(--accent);transition:width .35s ease}
  .thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-behavior:smooth;scrollbar-width:thin}
  .thumb{flex:0 0 auto;width:120px;aspect-ratio:1600/1036;border:2px solid transparent;border-radius:4px;padding:0;background:#fff;cursor:pointer;overflow:hidden;opacity:.55;transition:opacity .2s,border-color .2s,transform .15s;outline-offset:2px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb:hover{opacity:.9;transform:translateY(-2px)}
  .thumb.active{opacity:1;border-color:var(--accent)}
  @media (max-width:600px){
    .book{padding:8px}
    .nav{width:36px;height:36px}.prev{left:6px}.next{right:6px}
    .thumb{width:84px}
  }
</style>

    thumbs.forEach(function(t,j){t.classList.toggle('active',j===i);t.setAttribute('aria-current',j===i?'true':'false')});
    cur.textContent=i+1; prog.style.width=((i+1)/n*100)+'%';
    prev.disabled=i===0; next.disabled=i===n-1;
    var t=thumbs[i], box=t.parentNode;
    box.scrollLeft=t.offsetLeft-box.clientWidth/2+t.clientWidth/2;
  }
  prev.onclick=function(){go(i-1)}; next.onclick=function(){go(i+1)};
  thumbs.forEach(function(t,j){t.onclick=function(){go(j)}});
  stage.addEventListener('click',function(e){
    if(e.target.closest('.nav')) return;
    var r=stage.getBoundingClientRect(); go(e.clientX-r.left<r.width/2?i-1:i+1);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight') go(i+1); else if(e.key==='ArrowLeft') go(i-1);
  });
  var x0=null;
  stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',function(e){
    if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>40) go(dx<0?i+1:i-1);
  });
  // Tell a parent page our height so the iframe can size itself
  function postH(){try{parent.postMessage({flipbookHeight:document.querySelector('.book').offsetHeight,id:location.pathname},'*')}catch(e){}}
  window.addEventListener('load',postH); window.addEventListener('resize',postH);
  go(0);
})();
</script>
</body>
</html>
